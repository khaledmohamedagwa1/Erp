{{- if .Values.pdf.gotenberg.enabled }}
# Optional HTML -> PDF engine. Only the API talks to it (cluster-internal service, no ingress).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "erp.fullname" . }}-gotenberg
  labels:
    {{- include "erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: gotenberg
spec:
  replicas: {{ .Values.pdf.gotenberg.replicaCount }}
  selector:
    matchLabels:
      {{- include "erp.selectorLabels" (dict "root" . "component" "gotenberg") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "erp.selectorLabels" (dict "root" . "component" "gotenberg") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gotenberg
          image: {{ .Values.pdf.gotenberg.image }}
          args: ["gotenberg", "--api-timeout=60s", "--chromium-disable-javascript=true", "--chromium-allow-list=file:///tmp/.*"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.pdf.gotenberg.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "erp.fullname" . }}-gotenberg
  labels:
    {{- include "erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: gotenberg
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    {{- include "erp.selectorLabels" (dict "root" . "component" "gotenberg") | nindent 4 }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "erp.fullname" . }}-gotenberg
  labels:
    {{- include "erp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "erp.selectorLabels" (dict "root" . "component" "gotenberg") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "erp.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
      ports:
        - port: 3000
  # No egress: documents are self-contained HTML, so the converter never needs the network.
  egress: []
{{- end }}
{{- end }}
