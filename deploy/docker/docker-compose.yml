# Local development / evaluation stack (NOT for production — see deploy/onprem for that).
#   cp deploy/docker/.env.example deploy/docker/.env   # then set SQL_SA_PASSWORD
#   docker compose -f deploy/docker/docker-compose.yml --env-file deploy/docker/.env up --build
# The migrator is a one-shot that only runs when you ask for it (explicit, ADR-015):
#   docker compose -f deploy/docker/docker-compose.yml --env-file deploy/docker/.env --profile migrate run --rm migrator
name: erp-dev

x-erp-connection: &erp-connection "Server=sqlserver,1433;Database=${ERP_DATABASE:-Erp};User Id=sa;Password=${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD in .env};TrustServerCertificate=True;Encrypt=True"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD in .env}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  migrator:
    profiles: ["migrate"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.migrator
    image: erp-migrator:${ERP_TAG:-local}
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      ConnectionStrings__Erp: *erp-connection
    command: ["migrate"]
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    image: erp-api:${ERP_TAG:-local}
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Erp: *erp-connection
      Erp__Role: all
      Database__AutoMigrate: ${DATABASE_AUTOMIGRATE:-false}
      Platform__ApiKey: ${PLATFORM_API_KEY:-}
      Auth__SigningKeyPem: ${AUTH_SIGNING_KEY_PEM:-}
      Auth__SecureCookies: ${AUTH_SECURE_COOKIES:-false}
      Hosting__CorsAllowedOrigins__0: ${CORS_ORIGIN:-http://localhost:5173}
      Documents__Attachments__LocalRoot: /var/lib/erp/files/attachments
      # Empty = no PDF output (501). With --profile pdf: http://gotenberg:3000
      Pdf__GotenbergUrl: ${PDF_GOTENBERG_URL:-}
      # Memory (default) or Redis — start the "redis" profile and set ERP_CACHE_PROVIDER=Redis to try the shared cache.
      ErpCache__Provider: ${ERP_CACHE_PROVIDER:-Memory}
      ErpCache__RedisConnection: redis:6379,abortConnect=false
    volumes:
      - files:/var/lib/erp/files
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  # Optional PDF engine (profile pdf). When running, set PDF_GOTENBERG_URL in .env to http://gotenberg:3000 so documents and reports can be
  # downloaded as PDF (?format=pdf); otherwise PDF requests answer 501 and HTML output stays available.
  gotenberg:
    profiles: ["pdf"]
    image: ${ERP_GOTENBERG_IMAGE:-gotenberg/gotenberg:8}
    command: ["gotenberg", "--api-timeout=60s", "--chromium-disable-javascript=true", "--chromium-allow-list=file:///tmp/.*"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  redis:
    profiles: ["redis"]
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

volumes:
  sqldata:
  files:
