# Local development / evaluation stack. Copy .env.example to .env and set real values first.
#   docker compose -f deploy/docker/docker-compose.yml --env-file deploy/docker/.env up --build
name: erp
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12

  migrator:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.migrator
    environment:
      ConnectionStrings__Erp: "Server=sqlserver,1433;Database=Erp;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
    depends_on:
      sqlserver:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Erp: "Server=sqlserver,1433;Database=Erp;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      Erp__Role: all
      Database__AutoMigrate: "false"
      Platform__ApiKey: ${PLATFORM_API_KEY:-}
      Auth__SigningKeyPem: ${AUTH_SIGNING_KEY_PEM:-}
      Auth__SecureCookies: ${AUTH_SECURE_COOKIES:-false}
    ports:
      - "8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully

volumes:
  sqldata:
