# Reverse proxy for the on-prem stack: TLS termination with the customer's certificate (certs/tls.crt + tls.key).
# Runs as the unprivileged nginx user on 8080/8443 inside the container (published as 80/443).
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65s;
    client_max_body_size 10m;          # matches Hosting:MaxRequestBodyBytes
    client_body_timeout 30s;
    client_header_timeout 15s;

    log_format erp '$remote_addr - [$time_iso8601] "$request" $status $body_bytes_sent $request_time '
                   'rid=$request_id ua="$http_user_agent"';
    access_log /dev/stdout erp;

    # Abuse protection in front of the app's own rate limiter.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:20m rate=50r/s;

    upstream erp_api {
        server api:8080;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

    server {
        listen 8080;
        server_name _;
        location = /nginx-health { access_log off; return 200 "ok\n"; }
        location / {
            include /tmp/redirect*.conf;   # -> ERP_PUBLIC_ORIGIN (see redirect.conf.template)
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        include /etc/nginx/security-headers.conf;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # nginx owns these headers so they are also present on proxy-generated errors (502/504).
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;

        location = /nginx-health { access_log off; return 200 "ok\n"; }

        # Platform provisioning API: not exposed through the public proxy. Operators use the migrator instead.
        location /api/v1/platform/ { return 404; }

        location /api/v1/auth/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://erp_api;
        }

        location /health/ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://erp_api;
        }

        location / {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://erp_api;
        }
    }
}
