name: docker

# Builds both images on every PR touching the backend or deployment files; pushes to GHCR (and signs keylessly with
# Sigstore via GitHub OIDC) only for main and version tags. No registry secrets are stored: GITHUB_TOKEN + OIDC.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["backend/**", "deploy/docker/**", ".dockerignore", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["backend/**", "deploy/docker/**", ".dockerignore", ".github/workflows/docker.yml"]
  workflow_dispatch:
    inputs:
      scan:
        description: Run the Trivy vulnerability scan
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Set the repository variable TRIVY_SCAN=false to skip scanning on push/PR.
  RUN_SCAN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.scan) || (vars.TRIVY_SCAN != 'false' && 'true' || 'false') }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        image: [api, migrator]
    permissions:
      contents: read
      packages: write          # push to GHCR with GITHUB_TOKEN
      id-token: write          # OIDC token for keyless cosign signing
      security-events: write   # upload Trivy SARIF
    env:
      PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.image }}
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ env.PUSH == 'true' }}
          sbom: ${{ env.PUSH == 'true' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan image (Trivy)
        if: env.RUN_SCAN == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.PUSH == 'true' && format('{0}@{1}', steps.name.outputs.image, steps.build.outputs.digest) || fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload scan results
        if: env.RUN_SCAN == 'true' && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: Install cosign
        if: env.PUSH == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, GitHub OIDC)
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.name.outputs.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
